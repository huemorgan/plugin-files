<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reader — Luna Files</title>
  <link rel="stylesheet" href="vendor/highlight-theme.min.css">
  <link rel="stylesheet" href="style.css?v=0.11.0">
</head>
<body class="reader-body">
  <header class="rd-bar">
    <span class="rd-title" id="rd-title">Loading…</span>
    <span class="rd-spacer"></span>
    <div class="rd-zoom" role="group" aria-label="Text size">
      <button class="btn rd-btn" id="rd-smaller" title="Smaller text">A−</button>
      <button class="btn rd-btn" id="rd-bigger" title="Larger text">A+</button>
    </div>
    <button class="btn rd-btn" id="rd-print" title="Print or save as PDF">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg><span>Print</span></button>
    <button class="btn rd-btn" id="rd-close" title="Close this window">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg><span>Close</span></button>
  </header>
  <main class="rd-main">
    <article class="markdown-view rd-doc" id="rd-doc"></article>
  </main>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="md.js?v=0.11.0"></script>
  <script src="reader.js?v=0.11.0"></script>
</body>
</html>
